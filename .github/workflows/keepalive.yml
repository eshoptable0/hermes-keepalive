name: Hermes Keepalive

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install instabox CLI (cached)
        uses: actions/cache@v4
        id: cli-cache
        with:
          path: ~/.local/bin/instabox
          key: instabox-cli-v1

      - name: Download CLI if not cached
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://instabox.sh/install.sh | bash

      - name: Wake machine if not running
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: m_agq36rbxje3ik64ti4crshki6i
        run: |
          set -e
          STATE=$(instabox list --json 2>/dev/null | jq -r --arg id "$MACHINE_ID" '.[] | select((.id|tostring|startswith($id)) or .name=="hermes-vps") | .state' | head -1)
          echo "machine state: ${STATE:-unknown}"
          if [ -z "$STATE" ]; then
            instabox start hermes-vps --no-wait || true
          elif [ "$STATE" != "running" ]; then
            echo "waking machine..."
            instabox start hermes-vps --no-wait || instabox start hermes-vps
            sleep 45
            instabox list --json 2>/dev/null | jq -r --arg id "$MACHINE_ID" '.[] | select((.id|tostring|startswith($id)) or .name=="hermes-vps") | .state' | head -1
          else
            echo "machine running — nothing to do"
          fi

      - name: Daily heartbeat (prevents 60-day workflow disable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(git log -1 --format=%cs 2>/dev/null || echo "")
          if [ "$LAST" != "$TODAY" ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive@users.noreply.github.com"
            echo "$TODAY" > .heartbeat
            git add .heartbeat
            git commit -m "heartbeat $TODAY"
            git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main || true
          else
            echo "heartbeat already done today"
          fi
