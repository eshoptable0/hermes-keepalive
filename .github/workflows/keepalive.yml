name: Hermes Keepalive

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min — well inside the 2h limit
  workflow_dispatch:          # manual trigger option

permissions:
  contents: write             # for the heartbeat commit

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install instabox CLI
        run: curl -fsSL https://instabox.sh/install.sh | bash

      - name: Wake machine if not running
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: m_agq36rbxje3ik64ti4crshki6i
        run: |
          set -e
          STATE=$(instabox machines list --json 2>/dev/null | jq -r --arg id "$MACHINE_ID" '.[] | select(.id==$id or .name==$id) | .state' | head -1)
          echo "machine state: ${STATE:-unknown}"
          if [ "$STATE" != "running" ]; then
            echo "waking machine..."
            instabox start "$MACHINE_ID" --no-wait || instabox start "$MACHINE_ID"
            sleep 30
            STATE2=$(instabox machines list --json 2>/dev/null | jq -r --arg id "$MACHINE_ID" '.[] | select(.id==$id or .name==$id) | .state' | head -1)
            echo "state after start: $STATE2"
          fi

      - name: Heartbeat (keep workflow active)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          date -u +"last run: %Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git diff --cached --quiet && echo "no change" || git commit -m "heartbeat $(date -u +%s)"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main || true
