name: Hermes Keepalive

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install instabox CLI (cached)
        uses: actions/cache@v4
        id: cli-cache
        with:
          path: ~/.local/bin/instabox
          key: instabox-cli-v1

      - name: Download CLI if not cached
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://instabox.sh/install.sh | bash

      - name: Wake machines if not running
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -e
          for M in hermes-vps sakeena; do
            STATE=$(instabox list --json 2>/dev/null | jq -r --arg m "$M" '.[] | select(.name==$M) | .state' | head -1)
            echo "$M state: ${STATE:-unknown}"
            if [ "$STATE" != "running" ]; then
              echo "waking $M..."
              instabox start "$M" --no-wait || instabox start "$M" || true
              sleep 30
            fi
          done
          echo "--- final states ---"
          instabox list --json 2>/dev/null | jq -r '.[] | select(.name=="hermes-vps" or .name=="sakeena") | "\(.name): \(.state)"'

      - name: Daily heartbeat (prevents 60-day workflow disable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(git log -1 --format=%cs 2>/dev/null || echo "")
          if [ "$LAST" != "$TODAY" ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive@users.noreply.github.com"
            echo "$TODAY" > .heartbeat
            git add .heartbeat
            git commit -m "heartbeat $TODAY"
            git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main || true
          else
            echo "heartbeat already done today"
          fi
